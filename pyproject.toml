[project]
name = "vingilot"
version = "0.1.0"
description = "Development tooling for the Vingilot zsh prompt"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
required-version = "==0.13.0"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-include = ["tools/build-*", "tools/lint-*", "tools/prepare-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
