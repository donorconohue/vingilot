name: Vingilot checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version-file: pyproject.toml
          enable-cache: false
          download-from-astral-mirror: false
      - name: Prepare distro zsh for native tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          zsh --version
      - run: uv sync --locked
      - run: uv run --locked python tools/prepare-starship
      - run: make check
